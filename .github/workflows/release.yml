name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --legacy-peer-deps

      - run: npm run check
      - run: npm run test
      - run: npm run build

      - name: Create release with worker.js
        uses: softprops/action-gh-release@v2
        with:
          files: dist/worker.js
