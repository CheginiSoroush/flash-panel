name: Generate Snake

# مار نمودار contributions برای README — هر ۱۲ ساعت بازتولید می‌شود
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # انتشار با git خام — هویت کامیت همیشه خود کاربر، هرگز bot.
      # (اکشن قبلی crazy-max ورودی username/email ندارد و بی‌صدا
      #  به‌عنوان github-actions[bot] کامیت می‌کرد — ردپای هویتی ممنوع)
      - name: Publish to output branch
        run: |
          cd dist
          git init -q -b output
          git config user.name "CheginiSoroush"
          git config user.email "lmsoroush@proton.me"
          git add -A
          git commit -q -m "chore: regenerate contribution snake"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q --force origin output:output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
