name: Deploy to Cloudflare

# استقرار خودکار — پوسته‌ی نازک؛ تمام منطق در deploy/ci-deploy.sh است
# (الگوی راهنمای «استقرار خودکار روی Cloudflare Workers»).
#
# تریگرها:
#  - push به main  → دیپلوی مستقیم (هات‌فیکس / کامیت‌های عادی)
#  - release published → دیپلوی نسخه‌ی ریلیز (تگ v*)
#    نکته: mirror-commit های release.yml با GITHUB_TOKEN پوش می‌شوند و
#    push event تریگر نمی‌شوند — برای همین trigger جداگانه‌ی release لازم است.
#  - workflow_dispatch → دستی از تب Actions
#
# fail-closed: بدون CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID /
# PANEL_EMBED_JSON ورک‌فلو با پیام واضح شکست می‌خورد و ورکر زنده دست‌نخورده می‌ماند.

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_ID: ${{ secrets.CLOUDFLARE_KV_ID }}
          PANEL_EMBED_JSON: ${{ secrets.PANEL_EMBED_JSON }}
        run: bash deploy/ci-deploy.sh
