<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" role="img" aria-labelledby="aTitle aDesc">
<title id="aTitle">Flash Panel — animated request flow</title>
<desc id="hDesc2">Client connects through Cloudflare Edge running Flash Panel to origins; animated packets show the live path while the edge reports telemetry and self-tunes</desc>
<style>
.boxF{fill:#ffffff;fill-opacity:.94;stroke:#d0d7de;stroke-width:1.4}
.edgeB{stroke:#f59e0b;stroke-width:2}
.hdr{fill:#24292f;font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-weight:700;font-size:15px;letter-spacing:2px}
.sub{fill:#57606a;font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:11px}
.lane{stroke:#d0d7de;stroke-width:2;fill:none}
.lbl{fill:#9a6700;font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-weight:600;font-size:10px;letter-spacing:1.5px}
.dotP{fill:#1f2328;opacity:.10}
@media (prefers-color-scheme:dark){
.boxF{fill:#0d1117;fill-opacity:.95;stroke:#30363d}
.hdr{fill:#f0f6fc}
.sub{fill:#8b949e}
.lane{stroke:#30363d}
.lbl{fill:#fbbf24}
.dotP{fill:#e6edf3;opacity:.06}
}
</style>
<defs>
<linearGradient id="flowG" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#f59e0b" stop-opacity="0"/>
<stop offset="50%" stop-color="#f59e0b"/>
<stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
</linearGradient>
<pattern id="dotPat" width="26" height="26" patternUnits="userSpaceOnUse">
<circle cx="2" cy="2" r="1.1" class="dotP"/>
</pattern>
</defs>

<rect x="0" y="0" width="880" height="430" fill="url(#dotPat)"/>

<text x="440" y="26" text-anchor="middle" class="lbl" font-size="13" letter-spacing="6">REQUEST FLOW</text>
<path d="M368 38 H512" stroke="url(#flowG)" stroke-width="2" stroke-dasharray="40 104">
<animate attributeName="stroke-dashoffset" from="144" to="0" dur="1.6s" repeatCount="indefinite"/>
</path>

<!-- CLIENT -->
<rect x="50" y="140" width="190" height="150" rx="14" class="boxF"/>
<circle cx="145" cy="182" r="16" fill="none" stroke="#f59e0b" stroke-width="2"/>
<polygon points="140,174 140,190 153,182" fill="#f59e0b"/>
<text x="145" y="224" text-anchor="middle" class="hdr">CLIENT</text>
<text x="145" y="244" text-anchor="middle" class="sub">Xray · v2rayNG · Hiddify</text>
<text x="145" y="262" text-anchor="middle" class="sub">VLESS / Trojan / WARP</text>

<!-- EDGE -->
<rect x="345" y="104" width="190" height="214" rx="16" class="boxF edgeB">
<animate attributeName="stroke-opacity" values=".5;1;.5" dur="3s" repeatCount="indefinite"/>
</rect>
<circle cx="440" cy="104" r="17" fill="#F38020"/>
<text x="440" y="109" text-anchor="middle" fill="#ffffff" font-family="ui-sans-serif,sans-serif" font-weight="800" font-size="12">CF</text>
<text x="440" y="142" text-anchor="middle" class="hdr" font-size="14">FLASH PANEL</text>
<text x="440" y="160" text-anchor="middle" class="sub">Cloudflare Workers · global edge</text>
<circle cx="374" cy="190" r="3.5" fill="#34d399">
<animate attributeName="opacity" values="1;.4;1" dur="1.8s" repeatCount="indefinite"/>
</circle>
<text x="386" y="194" class="sub">WS token gate</text>
<circle cx="374" cy="216" r="3.5" fill="#fbbf24">
<animate attributeName="opacity" values="1;.4;1" dur="1.8s" begin="0.3s" repeatCount="indefinite"/>
</circle>
<text x="386" y="220" class="sub">Edge telemetry</text>
<circle cx="374" cy="242" r="3.5" fill="#fb7185">
<animate attributeName="opacity" values="1;.4;1" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
</circle>
<text x="386" y="246" class="sub">Auto-tuner loop</text>
<rect x="380" y="266" width="120" height="24" rx="12" fill="none" stroke="#34d399" stroke-opacity=".6">
<animate attributeName="stroke-opacity" values=".3;1;.3" dur="2s" repeatCount="indefinite"/>
</rect>
<text x="440" y="282" text-anchor="middle" fill="#34d399" font-family="ui-monospace,Consolas,monospace" font-weight="700" font-size="9" letter-spacing="2">OPERATIONAL</text>

<!-- ORIGIN -->
<rect x="640" y="140" width="190" height="150" rx="14" class="boxF"/>
<ellipse cx="735" cy="176" rx="9" ry="3.5" fill="none" stroke="#f43f5e" stroke-width="2"/>
<path d="M726 176 V190 M744 176 V190" fill="none" stroke="#f43f5e" stroke-width="2"/>
<ellipse cx="735" cy="190" rx="9" ry="3.5" fill="none" stroke="#f43f5e" stroke-width="2"/>
<text x="735" y="224" text-anchor="middle" class="hdr">ORIGIN</text>
<text x="735" y="244" text-anchor="middle" class="sub">VLESS / Trojan destinations</text>
<text x="735" y="262" text-anchor="middle" class="sub">ProxyIP pool · WARP · DoH</text>

<!-- LANES -->
<path d="M240 195 C288 195 296 195 344 195" class="lane"/>
<path d="M344 225 C296 225 288 225 240 225" class="lane"/>
<path d="M536 195 C584 195 592 195 640 195" class="lane"/>
<path d="M640 225 C592 225 584 225 536 225" class="lane"/>
<polygon points="344,195 334,190 334,200" fill="#f59e0b"/>
<polygon points="640,195 630,190 630,200" fill="#f59e0b"/>
<polygon points="240,225 250,220 250,230" fill="#fb7185"/>
<polygon points="536,225 546,220 546,230" fill="#fb7185"/>
<text x="292" y="183" text-anchor="middle" class="lbl">TLS 1.3 · WS</text>
<text x="292" y="247" text-anchor="middle" class="sub" font-size="10">response stream</text>
<text x="588" y="183" text-anchor="middle" class="lbl">CONNECT · 443</text>
<text x="588" y="247" text-anchor="middle" class="sub" font-size="10">proxied egress</text>

<!-- request packets client→edge -->
<circle r="4" fill="#fbbf24">
<animateMotion path="M240 195 C288 195 296 195 344 195" dur="1.4s" begin="0s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.88;1" dur="1.4s" begin="0s" repeatCount="indefinite"/>
</circle>
<circle r="4" fill="#fbbf24">
<animateMotion path="M240 195 C288 195 296 195 344 195" dur="1.4s" begin="-0.47s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.88;1" dur="1.4s" begin="-0.47s" repeatCount="indefinite"/>
</circle>
<circle r="4" fill="#fbbf24">
<animateMotion path="M240 195 C288 195 296 195 344 195" dur="1.4s" begin="-0.93s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.88;1" dur="1.4s" begin="-0.93s" repeatCount="indefinite"/>
</circle>
<!-- request packets edge→origin -->
<circle r="4" fill="#fbbf24">
<animateMotion path="M536 195 C584 195 592 195 640 195" dur="1.4s" begin="0.35s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.88;1" dur="1.4s" begin="0.35s" repeatCount="indefinite"/>
</circle>
<circle r="4" fill="#fbbf24">
<animateMotion path="M536 195 C584 195 592 195 640 195" dur="1.4s" begin="-0.12s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.88;1" dur="1.4s" begin="-0.12s" repeatCount="indefinite"/>
</circle>
<circle r="4" fill="#fbbf24">
<animateMotion path="M536 195 C584 195 592 195 640 195" dur="1.4s" begin="-0.59s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.88;1" dur="1.4s" begin="-0.59s" repeatCount="indefinite"/>
</circle>
<!-- response packets origin→edge -->
<circle r="4" fill="#fb7185">
<animateMotion path="M640 225 C592 225 584 225 536 225" dur="1.4s" begin="1.05s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.88;1" dur="1.4s" begin="1.05s" repeatCount="indefinite"/>
</circle>
<circle r="4" fill="#fb7185">
<animateMotion path="M640 225 C592 225 584 225 536 225" dur="1.4s" begin="0.58s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.88;1" dur="1.4s" begin="0.58s" repeatCount="indefinite"/>
</circle>
<circle r="4" fill="#fb7185">
<animateMotion path="M640 225 C592 225 584 225 536 225" dur="1.4s" begin="0.12s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.88;1" dur="1.4s" begin="0.12s" repeatCount="indefinite"/>
</circle>
<!-- response packets edge→client -->
<circle r="4" fill="#fb7185">
<animateMotion path="M344 225 C296 225 288 225 240 225" dur="1.4s" begin="0.7s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.88;1" dur="1.4s" begin="0.7s" repeatCount="indefinite"/>
</circle>
<circle r="4" fill="#fb7185">
<animateMotion path="M344 225 C296 225 288 225 240 225" dur="1.4s" begin="0.23s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.88;1" dur="1.4s" begin="0.23s" repeatCount="indefinite"/>
</circle>
<circle r="4" fill="#fb7185">
<animateMotion path="M344 225 C296 225 288 225 240 225" dur="1.4s" begin="-0.23s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.88;1" dur="1.4s" begin="-0.23s" repeatCount="indefinite"/>
</circle>

<!-- telemetry branch -->
<path d="M440 320 V352" class="lane" stroke-dasharray="4 7">
<animate attributeName="stroke-dashoffset" from="11" to="0" dur="1s" repeatCount="indefinite"/>
</path>
<circle r="2.5" fill="#34d399">
<animateMotion path="M440 320 L440 352" dur="1.1s" begin="0s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;1;0" dur="1.1s" begin="0s" repeatCount="indefinite"/>
</circle>
<circle r="2.5" fill="#34d399">
<animateMotion path="M440 320 L440 352" dur="1.1s" begin="0.55s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;1;0" dur="1.1s" begin="0.55s" repeatCount="indefinite"/>
</circle>
<rect x="320" y="354" width="240" height="36" rx="18" class="boxF"/>
<rect x="320" y="354" width="240" height="36" rx="18" fill="none" stroke="#34d399" stroke-opacity=".55" stroke-width="1.4">
<animate attributeName="stroke-opacity" values=".2;.8;.2" dur="2.5s" repeatCount="indefinite"/>
</rect>
<circle cx="340" cy="372" r="3.5" fill="#34d399">
<animate attributeName="r" values="3;4.5;3" dur="2s" repeatCount="indefinite"/>
</circle>
<text x="452" y="376" text-anchor="middle" class="sub">KV · telemetry · self-tuning</text>

<text x="440" y="416" text-anchor="middle" class="lbl" letter-spacing="1">EVERY CLOSED CONNECTION REPORTS RTT · COLO · ASN · BYTES</text>
</svg>
