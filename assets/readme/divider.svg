<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 26" role="img" aria-labelledby="dTitle">
<title id="dTitle">Flowing divider</title>
<defs>
<linearGradient id="fadeG" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#f59e0b" stop-opacity="0"/>
<stop offset="50%" stop-color="#f59e0b"/>
<stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
</linearGradient>
</defs>
<path d="M20 13 H740" stroke="url(#fadeG)" stroke-width="2" opacity=".32"/>
<path d="M20 13 H740" stroke="url(#fadeG)" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="70 650">
<animate attributeName="stroke-dashoffset" from="720" to="0" dur="2.8s" repeatCount="indefinite"/>
</path>
<circle cx="20" cy="13" r="3.4" fill="#f59e0b">
<animate attributeName="opacity" values=".5;1;.5" dur="2s" repeatCount="indefinite"/>
</circle>
<circle cx="740" cy="13" r="3.4" fill="#f59e0b">
<animate attributeName="opacity" values=".5;1;.5" dur="2s" begin="1s" repeatCount="indefinite"/>
</circle>
<g transform="translate(380 13)">
<g>
<rect x="-6" y="-6" width="12" height="12" fill="none" stroke="#f59e0b" transform="rotate(45)"/>
<animateTransform attributeName="transform" type="scale" values="1;2.4" dur="2.4s" repeatCount="indefinite"/>
<animate attributeName="opacity" values=".8;0" dur="2.4s" repeatCount="indefinite"/>
</g>
<g>
<rect x="-8" y="-8" width="16" height="16" fill="none" stroke="#f97316" stroke-opacity=".5" transform="rotate(45)"/>
<animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
</g>
<rect x="-5" y="-5" width="10" height="10" fill="#f59e0b" transform="rotate(45)">
<animate attributeName="opacity" values="1;.55;1" dur="2.4s" repeatCount="indefinite"/>
</rect>
</g>
</svg>
